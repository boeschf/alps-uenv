mojo-env:
  compiler: [gcc]
  network:
      mpi: cray-mpich@8.1.32 +rocm
  unify: true
  specs:
  - cmake
  - ninja
  - meson
  - libtree
  - python
  - amdsmi
  # Inter-node GPU collectives on MI300: rccl + aws-ofi-rccl are the ROCm
  # equivalents of nccl + aws-ofi-nccl used on the GH200 recipe.
  - rccl
  - aws-ofi-rccl
  - mojo@1.1.0-dev20260823
  - max@26.6.0-dev20260823
  variants:
  - +mpi
  - +rocm
  - ~cuda
  - amdgpu_target=gfx942
  - amdgpu_target_sram_ecc=gfx942
  views:
    mojo:
      link: all
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64, lib/max]
        env_vars:
          set:
          - MODULAR_CRASH_REPORTING_ENABLED: "0"
